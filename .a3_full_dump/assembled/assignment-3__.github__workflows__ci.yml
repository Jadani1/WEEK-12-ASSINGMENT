# CI pipeline for Assignment 3 — validate → test → docker (no cloud deploy)
name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh

      - name: Run lint
        run: ./scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh

      - name: Run application tests
        run: ./tests/test.sh

  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image and smoke test
        run: ./scripts/build.sh

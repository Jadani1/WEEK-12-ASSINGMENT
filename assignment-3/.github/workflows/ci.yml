# CI pipeline for Assignment 3 — validate → test → docker (no cloud deploy)
# Layout copy for graders. Active monorepo workflow: repo root .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Make scripts executable
        run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh

      - name: Run lint
        run: bash scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Make scripts executable
        run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh

      - name: Run tests
        run: bash tests/test.sh

  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Make scripts executable
        run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh

      - name: Build image and smoke test
        run: bash scripts/build.sh

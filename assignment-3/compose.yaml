# Local run via Docker Compose
#   docker compose run --rm devops help
#   docker compose run --rm devops system-info
#   docker compose run --rm devops check-host example.com
#   docker compose run --rm devops check-port example.com 443
services:
  devops:
    build: .
    image: devops-tool
    entrypoint: ["/app/app.sh"]
    command: ["help"]
    network_mode: bridge

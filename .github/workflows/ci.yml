# Week 12 monorepo CI — Assignment 3
# GitHub only loads workflows from the repository root .github/workflows/.
# The copy under assignment-3/.github/workflows/ci.yml satisfies the assignment
# layout and is kept in sync for graders that inspect assignment-3/.

name: Assignment 3 CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: assignment-3

jobs:
  validate:
    name: Validate (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Make scripts executable
        run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh

      - name: Run lint
        run: bash scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Make scripts executable
        run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh

      - name: Run tests
        run: bash tests/test.sh

  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Make scripts executable
        run: chmod +x grade.sh app/*.sh scripts/*.sh tests/*.sh

      - name: Build image and smoke test
        run: bash scripts/build.sh
